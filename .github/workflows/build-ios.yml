name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.0)"
        required: true
        default: "1.0.0"
      app_name:
        description: "App display name"
        required: true
        default: "Aperture"
      bundle_id:
        description: "Bundle identifier (e.g. com.example.mygallery)"
        required: true
        default: "com.djrenzo.Aperture"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject app icon
        run: |
          # Scale the 512x512 PWA icon up to the required 1024x1024
          sips -z 1024 1024 public/pwa-512x512.png \
            --out PhotoGalleryFrontend/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          python3 - <<'EOF'
          import json
          path = 'PhotoGalleryFrontend/Assets.xcassets/AppIcon.appiconset/Contents.json'
          with open(path) as f:
              data = json.load(f)
          data['images'][0]['filename'] = 'AppIcon.png'
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive
        run: |
          xcodebuild \
            -project PhotoGalleryFrontend.xcodeproj \
            -scheme PhotoGalleryFrontend \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/PhotoGalleryFrontend.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.version }}" \
            PRODUCT_NAME="${{ inputs.app_name }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.bundle_id }}"

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          # Find the .app regardless of PRODUCT_NAME
          APP_PATH=$(find build/PhotoGalleryFrontend.xcarchive/Products/Applications \
            -maxdepth 1 -name '*.app' | head -1)
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r PhotoGalleryFrontend.ipa Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ inputs.app_name }} v${{ inputs.version }}
          generate_release_notes: true
          files: build/PhotoGalleryFrontend.ipa